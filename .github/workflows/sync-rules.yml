name: Sync rules

on:
  push:
    paths:
      - rules.yaml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate shadowrocket-rules.list from rules.yaml
        run: grep -E '^\s+-\s' rules.yaml | sed 's/^\s*-\s*//' > shadowrocket-rules.list

      - name: Generate podkop-domains.lst from rules.yaml
        run: |
          awk -F, '/DOMAIN-SUFFIX,/{print $2} /- DOMAIN,/{print $2}' rules.yaml \
            | sed 's/^ *//' | sort -u > podkop-domains.lst

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shadowrocket-rules.list podkop-domains.lst
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync rules from rules.yaml"
            git push
          fi
